<html>
    <head>
        <title>My Playlist Sorter</title>
        <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body{background:lavender;}
            h1, h3{color:darkviolet;}
            .box{background:white; color:darkviolet;}
        </style>
    </head>
    <body>
        <div class="container py-4">

            <h1 class="mb-1">my playlist sorter</h1>
            <p class="text-muted mb-4">Sort and label your music playlist using javascript array method</p>

            <!--TOPIC 1&2:sort() and reverse()-->
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Song Nmaes</h3>
                    <button class="btn btn-primary " onclick="sortAZ()">Sort A to Z</button>
                    <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>
                    <div id="nameResult" class="boc p-3 mt-3 rounded"></div>
                </div>
            </div>

            <!--TOPIC 3:sort() with compare function-->
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Play count</h3>
                    <button class="btn btn-primary mr-2" onclick="sortLeast()">Least played first</button>
                    <button class="btn btn-primary" onclick="sortMost()">Most Playes First</button>
                    <div id="countResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>

            <!--TOPIC 4:map()-->
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Label every play count</h3>
                    <button class="btn btn-primary" onclick="addLabel()">Add Play Label</button>
                    <div id="labelResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>

        </div>
        <script>
            var songs=["zoom","Bounce","Glow","Rush","Spark"]; //TOPIC 1 & 2
            var plays=[320,85,210,50,175];  //TOPIC 3

            document.getElementById("nameResult").innerHTML ="songs: " + songs;
            document.getElementById("countResult").innerHTML ="plays:" + plays;
            document.getElementById("labelResult").innerHTML ="press the button above!";

            function sortAZ() {songs.sort()};
            document.getElementById("nameResult").innerHTML ="A to Z: " + songs; }
            function sortZA( songs.sort(); songs.reverse();
            document.getElementById("nameResult").innerHTML ="Z to A: " + songs;}
            function sortLeast() {plays.sort(function(a,b){return a-b;});
            document.getElementById("countResult").innerHTML ="Least played first: " + plays;}
            function addLabel() {var 1= plays.map(function(c){return c+" plays";})};
            document.getElementById("LabelResult").innerHTML ="Labelled: " +1;}
        </script>
    </body>
</html>
